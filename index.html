<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autotextes Softalmo</title>
<link rel="stylesheet" href="style.css">
<script src="formulaires.js"></script>
<script src="catalogue.js"></script>
<script src="app.js"></script>
</head>
<body>
<header class="entete-site">
  <h1>Autotextes Softalmo</h1>
  <nav class="onglets">
    <a href="#editeur">Éditeur</a>
    <a href="#catalogue">Catalogue</a>
  </nav>
  <label class="choix-formulaire">Formulaire
    <select id="formulaire"></select>
  </label>
</header>

<main>
  <div id="vue-editeur">
    <section class="barre">
      <p id="depart"></p>
      <div class="actions">
        <button type="button" id="copier" class="principal">Copier l'autotexte</button>
        <button type="button" id="importer">Importer un autotexte</button>
        <button type="button" id="effacer">Tout effacer</button>
      </div>
      <details>
        <summary>Voir l'autotexte <span id="compte"></span></summary>
        <textarea id="sortie" readonly rows="4" aria-label="Autotexte généré"></textarea>
      </details>
      <ul id="alertes" class="alertes" hidden></ul>
    </section>

    <div id="feuille" class="feuille"></div>
    <ul id="remarques" class="remarques"></ul>
  </div>

  <div id="vue-catalogue" hidden>
    <section class="filtres">
      <select id="filtre-patho" aria-label="Pathologie"></select>
      <select id="filtre-partie" aria-label="Partie de la feuille"></select>
    </section>
    <div id="liste" class="liste"></div>
  </div>
</main>

<dialog id="import">
  <form id="import-form">
    <h2>Importer un autotexte</h2>
    <label>Autotexte copié depuis Softalmo
      <textarea id="import-texte" rows="8" required></textarea>
    </label>
    <label>Champ où commence l'autotexte
      <select id="import-depart"></select>
    </label>
    <p class="aide">La feuille actuelle sera remplacée.</p>
    <div class="actions">
      <button type="submit" class="principal">Remplir la feuille</button>
      <button type="button" id="import-annuler">Annuler</button>
    </div>
  </form>
</dialog>
</body>
</html>
